const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
const t = (k) => T[lang][k];
const hl = (s) => esc(s).replace(/\[[^\]]*\]/g, m => `<mark>${m}</mark>`);

function applyLang() {
  document.documentElement.lang = lang === "zh" ? "zh-Hant" : "en";
  document.querySelectorAll("[data-i18n]").forEach(el => el.textContent = t(el.dataset.i18n));
  document.querySelectorAll("[data-i18n-html]").forEach(el => el.innerHTML = t(el.dataset.i18nHtml));
  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
  if (role && $("#roletext")) $("#roletext").textContent = t(role === "member" ? "roleMember" : "roleFriend");
  render();
}

async function copyText(text, btn) {
  const done = () => { const o = btn.textContent; btn.textContent = t("copied"); setTimeout(() => btn.textContent = o, 1400); };
  try { await navigator.clipboard.writeText(text); done(); }
  catch (e) {
    const sel = window.getSelection(); const r = document.createRange();
    const target = btn.closest(".card, .tpl")?.querySelector(".email, pre") || null;
    if (target) { r.selectNodeContents(target); sel.removeAllRanges(); sel.addRange(r); }
  }
}

let curCity = "";
const TITLE = { CA: "Representative", SD: "Senator", AD: "Assemblymember", MAYOR: "Mayor" };
function lastName(n) { return n === "Anamarie Ávila Farías" ? "Ávila Farías" : n.replace(/ (Jr\.|III|II)$/, "").split(" ").pop(); }
function salutation(kind, r) { return TITLE[kind] + (r.isNew ? "-elect " : " ") + lastName(r.n); }
function mailSubject() { return curCity ? SUBJECTS[0].replace("[City / Region]", curCity) : SUBJECTS[0]; }
function mailBody(sal) { const base = role === "friend" ? FRIEND_LETTER : LETTER; let b = sal ? base.replace("[Elected Official]", sal) : base; return curCity ? b.replace("[City]", curCity) : b; }
const UA = navigator.userAgent || "";
const IS_IOS = /iPhone|iPad|iPod/i.test(UA) || (/Macintosh/.test(UA) && navigator.maxTouchPoints > 1);
const IS_MOBILE = IS_IOS || /Android|Mobile/i.test(UA);
function mailtoURL(to, sal) {
  return "mailto:" + to.split(", ").join(",") + "?subject=" + encodeURIComponent(mailSubject()) + "&body=" + encodeURIComponent(mailBody(sal));
}
function gmailAppURL(to, sal) {
  return "googlegmail:///co?to=" + to.split(", ").join(",") + "&subject=" + encodeURIComponent(mailSubject()) + "&body=" + encodeURIComponent(mailBody(sal));
}
function sendButtons(to, sal) {
  if (IS_MOBILE) {
    let h = `<a class="ghost" href="${mailtoURL(to, sal)}">${esc(t("mailApp"))}</a>`;
    if (IS_IOS) h += `<a class="ghost" href="${gmailAppURL(to, sal)}">${esc(t("gmailApp"))}</a>`;
    return h;
  }
  return `<a class="ghost" href="${gmailURL(to, sal)}" target="_blank" rel="noopener">${esc(t("gmail"))} ↗</a><a class="ghost" href="${outlookURL(to, sal)}" target="_blank" rel="noopener">${esc(t("outlook"))} ↗</a>`;
}
function gmailURL(to, sal) {
  return "https://mail.google.com/mail/?view=cm&fs=1&to=" + encodeURIComponent(to) + "&su=" + encodeURIComponent(mailSubject()) + "&body=" + encodeURIComponent(mailBody(sal));
}
function outlookURL(to, sal) {
  return "https://outlook.live.com/mail/0/deeplink/compose?to=" + encodeURIComponent(to) + "&subject=" + encodeURIComponent(mailSubject()) + "&body=" + encodeURIComponent(mailBody(sal));
}
function copyLetterBtn(sal) {
  return `<div class="contact"><button type="button" class="ghost" data-copyletter="${esc(sal)}">${esc(t("copyLetter"))}</button></div>`;
}
function contactHTML(r, sal) {
  let h = "";
  if (r.url) h += `<a class="btn" href="${esc(r.url)}" target="_blank" rel="noopener">${esc(t("form"))} ↗</a>`;
  if (r.email) h += r.email.split(", ").map(e => `<span class="email">${esc(e)}</span>`).join("") + `<button type="button" class="ghost" data-copy="${esc(r.email)}">${esc(t("copyEmail"))}</button>${sendButtons(r.email, sal)}`;
  return h ? `<div class="contact">${h}</div>` : "";
}

function card(prefix, d, pct, r, outMsg) {
  const tag = `<div class="dist">${prefix}-${d}<span class="pct">${pct.toFixed(pct % 1 ? 1 : 0)}% ${esc(t("ofZip"))}</span></div>`;
  if (!r) return `<div class="card dim">${tag}<div class="body"><div class="name">${esc(outMsg)}</div></div></div>`;
  if (r.pending) return `<div class="card">${tag}<div class="body"><div class="name">${esc(r.pending)} <span class="chip pending">${esc(t("pending"))}</span></div></div></div>`;
  const chips = r.pend ? `<span class="chip pending">${esc(t("pend"))}</span>` : r.isNew ? `<span class="chip new">${esc(t("isNew"))}</span>` : r.re ? `<span class="chip re">${esc(t("reElected"))}</span>` : "";
  const vs = r.vs ? `<p class="note">${esc(t("leadVs"))}${esc(r.vs)}</p>` : "";
  const note = r.note ? `<p class="note">${esc(t(r.note))}</p>` : "";
  return `<div class="card">${tag}<div class="body"><div class="name">${esc(r.n)} (${r.p}) ${chips}</div>${vs}${contactHTML(r, salutation(prefix, r))}${copyLetterBtn(salutation(prefix, r))}${note}</div></div>`;
}

function list(entries) {
  const nz = entries.filter(e => e[1] > 0);
  return nz.length ? nz : entries;
}

function render() {
  const out = $("#out");
  if (!current) { out.innerHTML = ""; return; }
  if (current.error) { curCity = ""; out.innerHTML = `<div class="msg">${esc(t(current.error))}</div>`; renderTemplate(); return; }
  const z = ZIP[current.zip];
  if (!z) { curCity = ""; out.innerHTML = `<div class="msg">${esc(t("none"))}</div>`; renderTemplate(); return; }
  const [city, cds, sds, ads] = z;
  curCity = city || "";
  let h = `<div style="display:flex;flex-direction:column;gap:22px">`;
  h += `<div class="place"><span class="zipno">${esc(current.zip)}</span><span class="city">${esc(city || "")}</span>${current.example ? `<span class="example">${esc(t("example"))}</span>` : ""}</div>`;

  h += `<section class="cat"><h2>${esc(t("cd"))} <small>${esc(t("cdWhen"))}</small></h2>`;
  list(cds).forEach(([d, p]) => h += card("CA", d, p, CD[d], t("cdOut")));
  if (list(cds).some(([d]) => CD[d])) h += `<p class="note">${esc(t("formTip"))}</p>`;
  h += `</section>`;

  h += `<section class="cat"><h2>${esc(t("sd"))} <small>${esc(t("sdWhen"))}</small></h2>`;
  list(sds).forEach(([d, p]) => h += card("SD", d, p, SD[d], d % 2 ? t("sdOdd") : t("sdOut")));
  h += `</section>`;

  h += `<section class="cat"><h2>${esc(t("ad"))} <small>${esc(t("adWhen"))}</small></h2>`;
  list(ads).forEach(([d, p]) => h += card("AD", d, p, AD[d], t("adOut")));
  h += `</section>`;

  const m = MAYOR[city];
  h += `<section class="cat"><h2>${esc(t("mayor"))} <small>${esc(t("mayorWhen"))}</small></h2>`;
  if (m && m.st === "close") {
    h += `<div class="card dim"><div class="dist">${esc(city)}</div><div class="body"><div class="name">${esc(t("mayorClose"))}</div></div></div>`;
  } else if (m) {
    const chip = m.st === "called" ? "" : `<span class="chip pending">${esc(t(m.st))}</span>`;
    h += `<div class="card"><div class="dist">${esc(city)}</div><div class="body"><div class="name">${esc(m.n)} ${chip}</div>${m.email ? contactHTML({email:m.email}, salutation("MAYOR", m)) : `<div class="contact"><a class="ghost" href="${esc(m.url)}" target="_blank" rel="noopener">${esc(t("cityWeb"))} ↗</a></div>`}${copyLetterBtn(salutation("MAYOR", m))}</div></div>`;
  } else {
    h += `<div class="card dim"><div class="dist">${esc(city || "")}</div><div class="body"><div class="name">${esc(t("noMayor"))}</div></div></div>`;
  }
  h += `</section></div>`;
  out.innerHTML = h;
  renderTemplate();
}

$("#form").addEventListener("submit", (e) => {
  e.preventDefault();
  const v = $("#zip").value.trim();
  if (!/^\d{5}$/.test(v)) { current = { error: "bad" }; render(); return; }
  current = { zip: v, example: false }; render();
});
$("#zip").addEventListener("input", (e) => { e.target.value = e.target.value.replace(/\D/g, "").slice(0, 5); });
document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => {
  lang = b.dataset.lang; try { localStorage.setItem("lang", lang); } catch (e) {} applyLang();
}));
$("#out").addEventListener("click", (e) => {
  const cl = e.target.closest("[data-copyletter]"); if (cl) { copyRich(mailBody(cl.dataset.copyletter), cl); return; }
  const b = e.target.closest("[data-copy]"); if (b) copyText(b.dataset.copy, b);
});
function letterHTML(text) {
  const linked = esc(text).replace("Formosan Association for Public Affairs (FAPA)", '<a href="https://fapa.org/">Formosan Association for Public Affairs (FAPA)</a>').replace(/\nhttps:\/\/fapa\.org\/$/, '\n<a href="https://fapa.org/">https://fapa.org/</a>');
  return linked.split("\n\n").map(p => `<p>${p.replace(/\n/g, "<br>")}</p>`).join("");
}
async function copyRich(text, btn) {
  const done = () => { const o = btn.textContent; btn.textContent = t("copied"); setTimeout(() => btn.textContent = o, 1400); };
  try {
    if (window.ClipboardItem) {
      const plain = text;
      await navigator.clipboard.write([new ClipboardItem({
        "text/html": new Blob([letterHTML(text)], { type: "text/html" }),
        "text/plain": new Blob([plain], { type: "text/plain" })
      })]);
      done(); return;
    }
  } catch (e) {}
  copyText(text, btn);
}
$("#copy-letter").addEventListener("click", (e) => copyRich(mailBody(""), e.currentTarget));
function renderTemplate() {
  $("#subjects").innerHTML = `<li>${hl(mailSubject())}</li>`;
  $("#letter").innerHTML = hl(mailBody(""));
}
function applyRole() {
  $("#choose").hidden = !!role;
  ["#form", "#out", "#tpl", "#rolebar"].forEach(s => $(s).hidden = !role);
  if (role) $("#roletext").textContent = t(role === "member" ? "roleMember" : "roleFriend");
  render();
}
document.querySelectorAll(".choice").forEach(b => b.addEventListener("click", () => {
  role = b.dataset.role; applyRole();
  $("#zip").focus();
}));
$("#switchRole").addEventListener("click", () => { role = null; applyRole(); });
applyLang();
applyRole();
</script>
