<body>


<div class="wrap">
  <header>
    <div class="topbar">
      <span class="eyebrow" data-i18n="eyebrow"></span>
      <div class="lang" role="group" aria-label="Language">
        <button type="button" id="lang-zh" data-lang="zh">中文</button>
        <button type="button" id="lang-en" data-lang="en">English</button>
      </div>
    </div>
    <h1 data-i18n="title"></h1>
    <div class="lede" data-i18n-html="lede"></div>
    <p class="tally" id="tally" hidden></p>
  </header>

  <section class="choose" id="choose" aria-labelledby="choose-h">
    <h2 id="choose-h" data-i18n="chooseQ"></h2>
    <div class="choices">
      <button type="button" class="choice" data-role="member"><strong data-i18n="memberT"></strong><span data-i18n="memberD"></span></button>
      <button type="button" class="choice" data-role="friend"><strong data-i18n="friendT"></strong><span data-i18n="friendD"></span></button>
    </div>
  </section>
  <p class="rolebar" id="rolebar" hidden><span id="roletext"></span><button type="button" class="linkbtn" id="switchRole" data-i18n="switchRole"></button></p>

  <form class="search" id="form" autocomplete="off">
    <label for="zip" data-i18n="label"></label>
    <div class="row">
      <input id="zip" inputmode="numeric" pattern="[0-9]*" maxlength="5" placeholder="94086">
      <button class="btn" type="submit" data-i18n="go"></button>
    </div>
    <p class="hint" data-i18n-html="hint"></p>
  </form>

  <div id="out"></div>

  <section class="tpl" id="tpl" aria-labelledby="tpl-h">
    <h2 id="tpl-h" data-i18n="tplTitle"></h2>
    <p class="note" data-i18n-html="tplNote"></p>
    <div>
      <div class="tplhead"><strong data-i18n="subjTitle"></strong></div>
      <ul class="subjects" id="subjects"></ul>
    </div>
    <div class="tplhead"><strong data-i18n="letterTitle"></strong><span><span class="copied" id="copied-letter" hidden></span> <button type="button" class="ghost" id="copy-letter" data-i18n="copy"></button></span></div>
    <pre id="letter"></pre>
  </section>

  <section class="follow" aria-labelledby="follow-h">
    <svg class="follow-icon" viewBox="0 0 24 24" width="36" height="36" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.3" cy="6.7" r="1" fill="currentColor" stroke="none"/></svg>
    <div class="follow-body">
      <h2 id="follow-h" data-i18n="followTitle"></h2>
      <p data-i18n="followText"></p>
    </div>
    <a class="btn" href="https://www.instagram.com/fapa.ncal/" target="_blank" rel="noopener"><span data-i18n="followBtn"></span> ↗</a>
  </section>

  <footer>
    <span data-i18n="foot1"></span>
    <span data-i18n-html="foot2"></span>
  </footer>
</div>
